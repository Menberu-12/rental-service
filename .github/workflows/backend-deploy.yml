name: Backend Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Build and Test
      run: |
        npm run build
        npm test

    - name: Build Docker image
      run: docker build -t your-dockerhub-username/rental-services-backend .

    - name: Tag Docker image
      run: docker tag your-dockerhub-username/rental-services-backend your-dockerhub-username/rental-services-backend:latest

    - name: Push Docker image
      uses: docker/build-push-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        repository: your-dockerhub-username/rental-services-backend
        tag_with_ref: true
